<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiscalização Transmissão</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
:root{
  --navy:#0b2540; --navy2:#12395f; --teal:#0e7490; --amber:#f59e0b;
  --bg:#f3f5f8; --card:#fff; --ink:#13202d; --muted:#5b6b7b; --line:#dde3ea;
  --bad:#b91c1c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;font-size:14px}
header{background:linear-gradient(100deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;border-bottom:3px solid var(--amber)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 320px}
.brand svg{flex:none}
.brand h1{font-size:18px;margin:0;line-height:1.2}
.brand p{margin:2px 0 0;font-size:12px;opacity:.8}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:7px 14px;cursor:pointer;font:inherit}
.seg button.on{background:#fff;color:var(--navy);font-weight:600}
.btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.edit-on{background:var(--amber);color:#1c1300;border-color:var(--amber);font-weight:600}
#btnFiltros{display:none}
.layout{flex:1;display:flex;min-height:0}
aside{width:330px;flex:none;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
aside h2:first-child{margin-top:0}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
select,input[type=text],input[type=search],input[type=password],input[type=date],textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
select:disabled{background:#f1f3f6;color:#9aa6b2}
select:focus,input:focus,textarea:focus,button:focus-visible,.chip:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;cursor:pointer;user-select:none;background:#fff;font-size:12.5px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.45}
.chip.off i{background:#bbb!important}
.chip b{font-weight:600;color:var(--muted);font-size:11.5px}
.stats{background:#f0f6fa;border:1px solid #d5e4ee;border-radius:9px;padding:10px 12px;margin-top:14px;line-height:1.55}
.stats strong{font-size:18px;color:var(--navy)}
.reset{margin-top:12px;width:100%;padding:8px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font:inherit}
.reset:hover{background:#f3f5f8}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
main{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0}
#tableView{position:absolute;inset:0;overflow:auto;background:var(--card);display:none}
.tbl-wrap{padding:0 0 60px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:#f5f9fc}
table.t td.num{text-align:right;white-space:nowrap}
.tag{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.03em;white-space:nowrap}
.sit{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#f4f6f8;white-space:nowrap}
.sit.s1{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.sit.s2{background:#dcfce7;border-color:#86efac;color:#166534}
.sit.s3{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.pager{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:center}
.pager button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font:inherit}
.pager button:disabled{opacity:.4;cursor:default}
.link{color:var(--teal);cursor:pointer;text-decoration:underline}
a.gm{color:var(--teal)}
.leaflet-popup-content{margin:12px 14px;min-width:260px;max-width:340px}
.pp-h{display:flex;gap:8px;align-items:flex-start;margin-bottom:2px}
.pp-h b{font-size:14.5px;line-height:1.25}
.pp-sub{color:var(--muted);font-size:11.5px;margin-bottom:8px}
.pp table{border-collapse:collapse;width:100%;font-size:12.5px}
.pp td{padding:3px 0;vertical-align:top}
.pp td:first-child{color:var(--muted);width:40%;padding-right:8px}
.pp-fisc{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.pp-fisc h4{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pp-fisc label{display:block;font-size:11.5px;color:var(--muted);margin:6px 0 2px}
.pp-fisc textarea{min-height:54px;resize:vertical}
.pp-fisc .save{margin-top:8px;background:var(--navy);color:#fff;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;font:inherit}
.cl div{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;border:3px solid rgba(255,255,255,.85);box-shadow:0 1px 5px rgba(0,0,0,.35)}
.cl-sm div{background:var(--teal);width:40px;height:40px}
.cl-md div{background:var(--navy2);width:44px;height:44px}
.cl-lg div{background:#7c2d12;width:50px;height:50px}
.cl-xl div{background:#4c1d95;width:58px;height:58px;font-size:11.5px}
dialog{border:0;border-radius:12px;padding:20px;width:min(360px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,20,35,.55)}
dialog h3{margin:0 0 4px}
dialog p{margin:0 0 12px;color:var(--muted);font-size:13px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog .row button{padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit}
dialog .row button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.err{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5000}
.toast.show{opacity:1}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:6000;font-size:15px;color:var(--muted)}
@media (max-width:900px){
  #btnFiltros{display:inline-block}
  .layout{flex-direction:column}
  aside{width:100%;max-height:55vh;border-right:0;border-bottom:1px solid var(--line);display:none}
  aside.open{display:block}
  .brand h1{font-size:16px}
}

.chip.off{opacity:.45}
.muted{color:var(--muted)}
.cnt-sem{margin-top:6px;font-size:12px;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;border-radius:7px;padding:5px 8px}
.edbtn{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;padding:2px 8px;font:inherit}
dialog.big{width:min(460px,94vw)}
dialog label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
</style>
</head>
<body>
<div id="loading">Carregando subestações e linhas…</div>
<header>
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#f59e0b"/><path d="M22 6 11 23h8l-2 11 12-18h-8z" stroke="#0b2540" stroke-width="2.2" fill="none" stroke-linejoin="round"/></svg>
    <div>
      <h1>Fiscalização Subestações e Linhas de Transmissão</h1>
      <p id="subtitulo"></p>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="btnFiltros">Filtros</button>
    <div class="seg" role="tablist"><button id="vMapa" class="on">Mapa</button><button id="vTab">Tabela</button></div>
    <button class="btn" id="btnXlsx">Baixar XLSX</button>
    <button class="btn" id="btnCsv">Baixar CSV</button>
    <button class="btn" id="btnEdit">🔒 Editar</button>
  </div>
</header>
<div class="layout">
<aside id="aside">
  <h2>Localização</h2>
  <label class="f" for="fUF">UF (subestação, ou linha que passa pela UF)</label>
  <select id="fUF"></select>
  <label class="f" for="fAg">Proprietário / agente</label>
  <select id="fAg"></select>
  <label class="f" for="fQ">Buscar (nome da subestação ou da linha, agente)</label>
  <input type="search" id="fQ" placeholder="Ex.: Campo Grande, Imbirussu, Ivinhema…">

  <h2>O que mostrar</h2>
  <div class="chips" id="chipsTipo"></div>
  <h2>Tensão</h2>
  <div class="chips" id="chipsTen"></div>
  <h2>Linhas – situação</h2>
  <div class="chips" id="chipsSitL"></div>
  <h2>Linhas – rede</h2>
  <div class="chips" id="chipsRede"></div>

  <h2>Fiscalização</h2>
  <label class="f" for="fSit">Situação</label>
  <select id="fSit"></select>

  <div class="stats" id="stats"></div>
  <button class="reset" id="btnReset">Limpar filtros</button>
  <div class="note" id="nota"></div>
</aside>
<main>
  <div id="map"></div>
  <div id="tableView"><div class="tbl-wrap"><table class="t"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pager" id="pager"></div></div>
</main>
</div>

<dialog id="dlgSenha">
  <form method="dialog" id="formSenha">
    <h3>Modo de edição</h3>
    <p>Informe a senha para registrar fiscal, situação e observações.</p>
    <input type="password" id="inpSenha" autocomplete="off" placeholder="Senha">
    <div class="err" id="errSenha"></div>
    <div class="row"><button type="button" id="cancelSenha">Cancelar</button><button type="submit" class="pri">Entrar</button></div>
  </form>
</dialog>
<dialog id="dlgEdit" class="big">
  <form method="dialog" id="formEdit">
    <h3 id="edTitulo">Fiscalização</h3>
    <p id="edSub"></p>
    <label>Fiscal responsável</label><input type="text" id="dFiscal">
    <label>Situação</label><select id="dSit"></select>
    <label>Data da última fiscalização</label><input type="date" id="dData">
    <label>Observações</label><textarea id="dObs" rows="3"></textarea>
    <div class="row"><button type="button" id="edCancel">Cancelar</button><button type="submit" class="pri">Salvar</button></div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

/* SHA-256 em JS puro (funciona também abrindo o arquivo direto, sem https) */
const SK=[],SH=[];
(function(){let n=2;while(SK.length<64){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break;}
  if(p){if(SH.length<8)SH.push((Math.pow(n,.5)%1)*4294967296|0);SK.push((Math.pow(n,1/3)%1)*4294967296|0);}n++;}})();
function sha256(str){
  const m=new TextEncoder().encode(str), l=m.length, w=new Array(64);
  const nb=((l+9+63)>>6)<<4, blk=new Uint32Array(nb);
  for(let i=0;i<l;i++) blk[i>>2]|=m[i]<<(24-(i&3)*8);
  blk[l>>2]|=0x80<<(24-(l&3)*8);
  blk[nb-1]=l*8;
  let h=SH.slice();
  for(let o=0;o<nb;o+=16){
    for(let i=0;i<64;i++){
      if(i<16) w[i]=blk[o+i]|0;
      else{const a=w[i-15],c=w[i-2];
        const s0=(a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3);
        const s1=(c>>>17|c<<15)^(c>>>19|c<<13)^(c>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const S1=(e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7), ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+SK[i]+w[i])|0;
      const S0=(a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10), mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    h=[(h[0]+a)|0,(h[1]+b)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

const B_TIPO = new Uint8Array(N), B_TEN = new Uint8Array(N), B_SITL = new Uint8Array(N), B_REDE = new Uint8Array(N), UFB = new Int32Array(N), BUSCA = new Array(N);

function passa(i, skip){
  if(S.uf && !(UFB[i]&UFBIT[S.uf])) return false;
  if(S.ag!=='' && R(i)[isSE(i)?S_.AG:L_.AG]!==S.ag) return false;
  if(skip!=='tipo' && !(B_TIPO[i]&S.tipo)) return false;
  if(skip!=='ten' && !(B_TEN[i]&S.ten)) return false;
  if(!isSE(i)){
    if(skip!=='sitL' && !(B_SITL[i]&S.sitL)) return false;
    if(skip!=='rede' && !(B_REDE[i]&S.rede)) return false;
  }
  if(S.fsit && situacaoDe(i)!==S.fsit) return false;
  if(S.q && !BUSCA[i].includes(S.q)) return false;
  return true;
}

const lnLayer = L.layerGroup().addTo(map);
const cluster = L.markerClusterGroup({
  chunkedLoading:true, maxClusterRadius:40, disableClusteringAtZoom:9, spiderfyOnMaxZoom:false, showCoverageOnHover:false,
  iconCreateFunction:c=>{const n=c.getChildCount();
    const s=n<10?'sm':n<100?'md':n<1000?'lg':'xl'; const d={sm:40,md:44,lg:50,xl:58}[s];
    return L.divIcon({html:'<div><span>'+fmtN(n)+'</span></div>',className:'cl cl-'+s,iconSize:L.point(d,d)});}
}).addTo(map);
const markers = {}, polys = {};
function seRadius(i){ const kv=Math.max(...SE[i][S_.KV]); return kv>=500?8 : kv>=230?6.5 : 5; }
function marker(i){
  if(markers[i]) return markers[i];
  const s=SE[i], mx=Math.max(...s[S_.KV]);
  const m=L.circleMarker([s[S_.LAT],s[S_.LON]],{radius:seRadius(i),color:'#fff',weight:1.2,fillColor:TEN[tenG(mx)].cor==='#94a3b8'?'#475569':TEN[tenG(mx)].cor,fillOpacity:.95});
  m.bindPopup(()=>popupHtml(i),{maxWidth:360}); m.on('popupopen',()=>bindSalvar(i));
  markers[i]=m; return m;
}
function poly(i){
  if(polys[i]) return polys[i];
  const j=i-NS, l=LN[j], pts=lnPts(j), g=tenG(l[L_.KV]);
  const p=L.polyline(pts,{color:TEN[g].cor,weight:TEN[g].w,opacity:l[L_.ATIVA]?.75:.45,dashArray:l[L_.ATIVA]?(l[L_.TIPO]===2?'2 5':null):'6 6'});
  p.bindPopup(()=>popupHtml(i),{maxWidth:380}); p.on('popupopen',()=>bindSalvar(i));
  polys[i]=p; return p;
}
function popupHtml(i){
  const e=getEdit(i)||{}; let tag, sub, linhas;
  if(isSE(i)){
    const s=SE[i]; tag='Subestação'; sub=esc(AGS[s[S_.AG]])+' · '+esc(s[S_.UF]);
    linhas=[['Tensões',s[S_.KV].join(' / ')+' kV'],['Transformadores em operação',s[S_.NTR]+(s[S_.MVA]?' · '+fmtN(s[S_.MVA])+' MVA':'')],['Linhas em operação ligadas',s[S_.NLIN]],['Código ONS',esc(s[S_.ID])],
      ['Coordenadas',s[S_.LAT]!=null? s[S_.LAT].toFixed(5)+', '+s[S_.LON].toFixed(5)+' · <a class="gm" target="_blank" rel="noopener" href="'+gmapsUrl(s[S_.LAT],s[S_.LON])+'">Google Maps</a>' : '<span class="muted">sem coordenada na base do ONS</span>']];
  } else {
    const l=LN[i-NS]; tag=TIPOL[l[L_.TIPO]]; sub=esc(AGS[l[L_.AG]])+' · '+esc(ufTxt(i));
    linhas=[['De → Para',esc(l[L_.NA])+' → '+esc(l[L_.NB])],['Tensão',l[L_.KV]+' kV'+(l[L_.TIPO]===2?' (CC)':'')],['Rede',REDE[l[L_.REDE]]],['Comprimento',l[L_.KM]?fmtN(l[L_.KM])+' km':'—'],
      ['Capacidade (longa duração)',l[L_.CAP]?fmtN(l[L_.CAP])+' MVA':'—'],['Entrada em operação',fmtData(l[L_.ENT])||'—'],['Situação',l[L_.ATIVA]?'Em operação':'<b style="color:#92400e">Desativada em '+fmtData(l[L_.DES])+'</b>'],['Código ONS',esc(l[L_.COD])],
      ['Traçado',lnPts(i-NS)?'<span class="muted">reta entre as subestações (esquemático, não é a rota real)</span>':'<b style="color:#92400e">sem mapa: um dos terminais não tem coordenada</b>']];
  }
  let fisc;
  if(editMode){
    fisc='<div class="pp-fisc"><h4>Fiscalização (edição)</h4>'+
      '<label>Fiscal responsável</label><input type="text" id="eFiscal" value="'+esc(e.fiscal||'')+'">'+
      '<label>Situação</label><select id="eSit">'+SITUACOES.map(s=>'<option'+((e.sit||SITUACOES[0])===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'+
      '<label>Data da última fiscalização</label><input type="date" id="eData" value="'+esc(e.data||'')+'">'+
      '<label>Observações</label><textarea id="eObs">'+esc(e.obs||'')+'</textarea>'+
      '<button class="save" id="eSalvar">Salvar</button></div>';
  } else {
    fisc='<div class="pp-fisc"><h4>Fiscalização</h4><table><tr><td>Situação</td><td>'+sitTag(e.sit||SITUACOES[0])+'</td></tr>'+
      '<tr><td>Fiscal</td><td>'+(esc(e.fiscal)||'—')+'</td></tr>'+
      '<tr><td>Última fiscalização</td><td>'+(fmtData(e.data)||'—')+'</td></tr>'+
      (e.obs?'<tr><td>Observações</td><td>'+esc(e.obs)+'</td></tr>':'')+'</table></div>';
  }
  return '<div class="pp"><div class="pp-h"><span class="tag" style="background:'+corDe(i)+'">'+esc(tag)+'</span><b>'+esc(nomeDe(i))+'</b></div>'+
    '<div class="pp-sub">'+sub+'</div><table>'+linhas.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('')+'</table>'+fisc+'</div>';
}
function gravarEdicao(i,v){
  if(!v.fiscal && v.sit===SITUACOES[0] && !v.data && !v.obs) delete EDITS[keyOf(i)]; else EDITS[keyOf(i)]=v;
  persistEdits(); toast('Alterações salvas neste navegador.');
}
function bindSalvar(i){
  const b=$('eSalvar'); if(!b) return;
  b.onclick=()=>{ gravarEdicao(i,{fiscal:$('eFiscal').value.trim(),sit:$('eSit').value,data:$('eData').value,obs:$('eObs').value.trim()}); map.closePopup(); atualizarDepoisDeEditar(); };
}
function sitTag(s){ const c=s===SITUACOES[1]?'s1':s===SITUACOES[2]?'s2':s===SITUACOES[3]?'s3':''; return '<span class="sit '+c+'">'+esc(s)+'</span>'; }
let edIdx=-1;
function abrirEdicao(i){
  edIdx=i; const e=getEdit(i)||{};
  $('edTitulo').textContent=nomeDe(i);
  $('edSub').textContent=(isSE(i)?'Subestação':'Linha')+' · '+ufTxt(i)+' · '+kvTxt(i)+' kV';
  $('dSit').innerHTML=SITUACOES.map(s=>'<option'+((e.sit||SITUACOES[0])===s?' selected':'')+'>'+s+'</option>').join('');
  $('dFiscal').value=e.fiscal||''; $('dData').value=e.data||''; $('dObs').value=e.obs||'';
  $('dlgEdit').showModal();
}
$('edCancel').onclick=()=>$('dlgEdit').close();
$('formEdit').onsubmit=ev=>{ ev.preventDefault(); gravarEdicao(edIdx,{fiscal:$('dFiscal').value.trim(),sit:$('dSit').value,data:$('dData').value,obs:$('dObs').value.trim()}); $('dlgEdit').close(); atualizarDepoisDeEditar(); };

/* ===== aplicar filtros ===== */
function aplicar(ajustar){
  filtered=[]; for(let i=0;i<N;i++) if(passa(i)) filtered.push(i);
  cluster.clearLayers(); lnLayer.clearLayers();
  const ms=[], bounds=[]; let nse=0, nln=0, km=0, mva=0, semMapa=0;
  for(const i of filtered){
    if(isSE(i)){ nse++; mva+=SE[i][S_.MVA]; if(SE[i][S_.LAT]!=null){ ms.push(marker(i)); bounds.push([SE[i][S_.LAT],SE[i][S_.LON]]); } else semMapa++; }
    else { nln++; const l=LN[i-NS]; if(l[L_.ATIVA]) km+=l[L_.KM]; const p=lnPts(i-NS); if(p){ lnLayer.addLayer(poly(i)); bounds.push(p[0],p[1]); } else semMapa++; }
  }
  cluster.addLayers(ms);
  if(ajustar && bounds.length){ map.fitBounds(L.latLngBounds(bounds),{padding:[40,40],maxZoom:11}); }
  $('stats').innerHTML='<strong>'+fmtN(filtered.length)+'</strong> de '+fmtN(N)+' itens<br>'+fmtN(nse)+' subestações · '+fmtN(nln)+' linhas'+
    '<br>'+fmtN(Math.round(km))+' km de linhas em operação · '+fmtN(mva)+' MVA em transformadores'+(semMapa?'<div class="cnt-sem">'+fmtN(semMapa)+' sem posição no mapa (só na tabela e nos downloads)</div>':'');
  contarChips(); tablePage=0; renderTabela();
}
function atualizarDepoisDeEditar(){ if(S.fsit) aplicar(false); else renderTabela(); }

const GRUPOS = [
  {id:'chipsTipo', campo:'tipo', bits:B_TIPO, n:3, itens:()=>[{t:TIPOS[0].nome,cor:TIPOS[0].cor},{t:TIPOS[1].nome,cor:TIPOS[1].cor}], map:k=>k},
  {id:'chipsTen', campo:'ten', bits:B_TEN, n:6, itens:()=>TEN.map(x=>({t:x.t,cor:x.cor}))},
  {id:'chipsSitL', campo:'sitL', bits:B_SITL, n:2, itens:()=>SITL.map((t,k)=>({t,cor:k?'#94a3b8':'#dc2626'}))},
  {id:'chipsRede', campo:'rede', bits:B_REDE, n:2, itens:()=>REDE.map(t=>({t,cor:'#334155'}))}
];
function contarChips(){
  for(const g of GRUPOS){
    const c=new Array(g.n).fill(0);
    for(let i=0;i<N;i++) if(passa(i,g.campo)){ const b=g.bits[i]; for(let k=0;k<g.n;k++) if(b&(1<<k)) c[k]++; }
    document.querySelectorAll('#'+g.id+' .chip').forEach(el=>el.querySelector('b').textContent=fmtN(c[+el.dataset.k]));
  }
}

/* ===== tabela ===== */
const COLS=[
  {k:'nome',t:'Nome',v:i=>nomeDe(i)},
  {k:'tipo',t:'Tipo',v:i=>isSE(i)?0:1,num:true},
  {k:'uf',t:'UF',v:i=>ufTxt(i)},
  {k:'kv',t:'Tensão (kV)',v:i=>isSE(i)?Math.max(...SE[i][S_.KV]):LN[i-NS][L_.KV],num:true},
  {k:'ag',t:'Proprietário / agente',v:i=>agDe(i)},
  {k:'det',t:'Detalhe',v:i=>detTxt(i)},
  {k:'sit',t:'Situação',v:i=>sitTxt(i)},
  {k:'fsit',t:'Fiscalização',v:i=>situacaoDe(i)},
  {k:'fiscal',t:'Fiscal',v:i=>(getEdit(i)||{}).fiscal||''}
];
function renderTabela(){
  if($('tableView').style.display!=='block') return;
  const col=COLS.find(c=>c.k===tableSort.col)||COLS[0];
  const keys=new Map(); for(const i of filtered) keys.set(i,col.v(i));
  const idx=filtered.slice().sort((a,b)=>{const x=keys.get(a),y=keys.get(b); return (col.num? x-y : COLL.compare(String(x),String(y)))*tableSort.dir;});
  const pages=Math.max(1,Math.ceil(idx.length/PAGE)); if(tablePage>=pages) tablePage=pages-1;
  $('thead').innerHTML='<tr>'+COLS.map(c=>'<th data-k="'+c.k+'">'+c.t+(tableSort.col===c.k?(tableSort.dir>0?' ▲':' ▼'):'')+'</th>').join('')+(editMode?'<th></th>':'')+'</tr>';
  const part=idx.slice(tablePage*PAGE,(tablePage+1)*PAGE);
  $('tbody').innerHTML=part.map(i=>{ const e=getEdit(i)||{};
    return '<tr><td>'+(temPos(i)?'<span class="link" data-i="'+i+'">'+esc(nomeDe(i))+'</span>':esc(nomeDe(i)))+'</td><td><span class="tag" style="background:'+corDe(i)+'">'+(isSE(i)?'Subestação':'Linha')+'</span></td><td>'+esc(ufTxt(i))+
      '</td><td>'+esc(kvTxt(i))+'</td><td>'+esc(agDe(i))+'</td><td>'+esc(detTxt(i))+'</td><td>'+esc(sitTxt(i))+'</td><td>'+sitTag(situacaoDe(i))+'</td><td>'+esc(e.fiscal||'')+'</td>'+
      (editMode?'<td><button class="edbtn" data-ed="'+i+'">✎ Editar</button></td>':'')+'</tr>'; }).join('');
  $('pager').innerHTML='<button id="pPrev"'+(tablePage===0?' disabled':'')+'>← Anterior</button><span>Página '+fmtN(tablePage+1)+' de '+fmtN(pages)+' · '+fmtN(idx.length)+' itens</span><button id="pNext"'+(tablePage>=pages-1?' disabled':'')+'>Próxima →</button>';
  $('pPrev').onclick=()=>{tablePage--;renderTabela();$('tableView').scrollTop=0;};
  $('pNext').onclick=()=>{tablePage++;renderTabela();$('tableView').scrollTop=0;};
}
$('thead').addEventListener('click',ev=>{ const th=ev.target.closest('th'); if(!th||!th.dataset.k) return; const k=th.dataset.k;
  if(tableSort.col===k) tableSort.dir*=-1; else tableSort={col:k,dir:1}; tablePage=0; renderTabela(); });
$('tbody').addEventListener('click',ev=>{
  const a=ev.target.closest('.link'); if(a) return abrirNoMapa(+a.dataset.i);
  const b=ev.target.closest('[data-ed]'); if(b) abrirEdicao(+b.dataset.ed);
});
function abrirNoMapa(i){
  mostrar('mapa');
  setTimeout(()=>{ map.invalidateSize();
    if(isSE(i)){ const m=marker(i); if(!cluster.hasLayer(m)) cluster.addLayer(m); cluster.zoomToShowLayer(m,()=>m.openPopup()); }
    else { const p=poly(i); if(!lnLayer.hasLayer(p)) lnLayer.addLayer(p); map.fitBounds(p.getBounds(),{padding:[60,60],maxZoom:10}); p.openPopup(p.getBounds().getCenter()); }
  },50);
}
function mostrar(v){
  const tab = v==='tabela';
  $('tableView').style.display = tab?'block':'none';
  $('map').style.visibility = tab?'hidden':'visible';
  $('vMapa').classList.toggle('on',!tab); $('vTab').classList.toggle('on',tab);
  if(tab) renderTabela(); else setTimeout(()=>map.invalidateSize(),30);
}
$('vMapa').onclick=()=>mostrar('mapa'); $('vTab').onclick=()=>mostrar('tabela');
$('btnFiltros').onclick=()=>$('aside').classList.toggle('open');

/* ===== controles ===== */
function chip(k,txt,cor){ return '<span class="chip" data-k="'+k+'" title="'+esc(txt)+'" role="button" tabindex="0"><i style="background:'+cor+'"></i>'+esc(txt)+' <b>0</b></span>'; }
function syncChips(){ for(const g of GRUPOS) document.querySelectorAll('#'+g.id+' .chip').forEach(el=>el.classList.toggle('off',!(S[g.campo]&(1<<(+el.dataset.k))))); }
function montarControles(){
  $('fUF').innerHTML='<option value="">Todas as UFs ('+UFS.length+')</option>'+UFS.map(u=>'<option>'+u+'</option>').join('');
  const ordem=AGS.map((a,k)=>[a,k]).sort((x,y)=>COLL.compare(x[0],y[0]));
  $('fAg').innerHTML='<option value="">Todos ('+AGS.length+')</option>'+ordem.map(x=>'<option value="'+x[1]+'">'+esc(x[0])+'</option>').join('');
  $('fSit').innerHTML='<option value="">Todas</option>'+SITUACOES.map(s=>'<option>'+s+'</option>').join('');
  for(const g of GRUPOS) $(g.id).innerHTML=g.itens().map((it,k)=>chip(k,it.t,it.cor)).join('');
  $('subtitulo').textContent='Fonte: ONS · Rede de Operação do SIN (Rede Básica e Complementar) · extração de '+fmtData(DATA.meta.gerado)+' · '+fmtN(DATA.meta.ses)+' subestações · '+fmtN(DATA.meta.lns)+' linhas';
  $('nota').innerHTML='<b>Sobre os dados.</b> Reúne as instalações que o ONS opera no sistema interligado: principalmente subestações e linhas de <b>230 kV ou mais</b> (Rede Básica), além de parte da Rede Complementar (a partir de 69 kV). '+
    '<b>Não inclui</b> a rede de distribuição das concessionárias nem subestações particulares menores. <b>O traçado das linhas é esquemático</b>: o ONS não publica a rota, então cada linha é uma reta entre as duas subestações (a rota real é mais sinuosa). '+
    'Linhas com terminal em usina ou sem coordenada ficam só na tabela. A base não traz município; use UF, proprietário e busca. Linhas desativadas ficam ocultas por padrão. '+
    'Fiscal, situação, data e observações ficam salvos neste navegador e entram nos downloads.';
  syncChips();
}
$('fUF').onchange=e=>{S.uf=e.target.value;aplicar(true);};
$('fAg').onchange=e=>{S.ag=e.target.value===''?'':+e.target.value;aplicar(true);};
$('fSit').onchange=e=>{S.fsit=e.target.value;aplicar(true);};
let tq; $('fQ').oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>{S.q=norm(e.target.value.trim());aplicar(true);},300);};
for(const g of GRUPOS){
  const box=$(g.id);
  const toggle=el=>{ S[g.campo]^=(1<<(+el.dataset.k)); el.classList.toggle('off',!(S[g.campo]&(1<<(+el.dataset.k)))); aplicar(true); };
  box.addEventListener('click',e=>{const c=e.target.closest('.chip'); if(c) toggle(c);});
  box.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.chip'); if(c){e.preventDefault();toggle(c);} }});
}
$('btnReset').onclick=()=>{ Object.assign(S,PADRAO()); for(const id of ['fUF','fAg','fSit','fQ']) $(id).value=''; syncChips(); aplicar(true); };

/* ===== exportação ===== */
const CAB=['Tipo','Nome','Código ONS','UF','Tensão (kV)','Proprietário / agente','Situação','Rede','Transformadores em operação','Potência instalada (MVA)','Linhas em operação ligadas','Terminal de','Terminal para','Comprimento (km)','Capacidade (MVA)','Entrada em operação','Desativação','Latitude','Longitude','Google Maps','Fiscal responsável','Situação da fiscalização','Data da última fiscalização','Observações'];
function linhaExport(i){
  const e=getEdit(i)||{}, fx=[e.fiscal||'',e.sit||SITUACOES[0],fmtData(e.data),e.obs||''];
  if(isSE(i)){ const s=SE[i]; return ['Subestação',s[S_.NOME],s[S_.ID],s[S_.UF],s[S_.KV].join(' / '),AGS[s[S_.AG]],'Em operação','',s[S_.NTR],s[S_.MVA],s[S_.NLIN],'','','','','','',s[S_.LAT]==null?'':s[S_.LAT],s[S_.LON]==null?'':s[S_.LON],s[S_.LAT]==null?'':gmapsUrl(s[S_.LAT],s[S_.LON])].concat(fx); }
  const l=LN[i-NS]; return [TIPOL[l[L_.TIPO]],l[L_.NOME],l[L_.COD],ufTxt(i),l[L_.KV],AGS[l[L_.AG]],sitTxt(i),REDE[l[L_.REDE]],'','','',l[L_.NA],l[L_.NB],l[L_.KM]||'',l[L_.CAP]||'',fmtData(l[L_.ENT]),fmtData(l[L_.DES]),'','',''].concat(fx);
}
function nomeArq(ext){ return 'transmissao_ons_'+(S.uf||'BR')+'_'+new Date().toISOString().slice(0,10)+'.'+ext; }
function baixar(blob,nome){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800); }
$('btnXlsx').onclick=()=>{
  if(!filtered.length){toast('Nenhum registro para baixar.');return;}
  if(typeof XLSX==='undefined'){toast('Biblioteca XLSX não carregou. Use o CSV.');return;}
  toast('Gerando XLSX…');
  setTimeout(()=>{
    const ws=XLSX.utils.aoa_to_sheet([CAB].concat(filtered.map(linhaExport))); ws['!cols']=[22,40,18,8,14,30,12,18,10,10,10,24,24,10,10,12,12,10,10,36,20,22,16,30].map(w=>({wch:w}));
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Transmissão'); XLSX.writeFile(wb,nomeArq('xlsx'));
    toast('XLSX gerado com '+fmtN(filtered.length)+' itens.');
  },30);
};
$('btnCsv').onclick=()=>{
  if(!filtered.length){toast('Nenhum registro para baixar.');return;}
  const cel=v=>{ if(v==null) return ''; if(typeof v==='number') return String(v).replace('.',','); const s=String(v); return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const txt=[CAB.join(';')].concat(filtered.map(i=>linhaExport(i).map(cel).join(';'))).join('\r\n');
  baixar(new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8'}),nomeArq('csv')); toast('CSV gerado com '+fmtN(filtered.length)+' itens.');
};

/* ===== modo de edição ===== */
function setEdit(on){ editMode=on; const b=$('btnEdit'); b.textContent=on?'✏️ Editando (sair)':'🔒 Editar'; b.classList.toggle('edit-on',on); map.closePopup(); renderTabela(); toast(on?'Modo de edição ativado. Clique num item (ou em “Editar” na tabela) para registrar a fiscalização.':'Modo de edição encerrado.'); }
$('btnEdit').onclick=()=>{ if(editMode){setEdit(false);return;} $('inpSenha').value='';$('errSenha').textContent='';$('dlgSenha').showModal();$('inpSenha').focus(); };
$('cancelSenha').onclick=()=>$('dlgSenha').close();
$('formSenha').onsubmit=ev=>{ ev.preventDefault();
  if(sha256($('inpSenha').value)===SENHA_HASH){ $('dlgSenha').close(); setEdit(true); } else { $('errSenha').textContent='Senha incorreta.'; $('inpSenha').select(); } };

montarControles();
aplicar(false);
$('loading').style.display='none';
</script>
